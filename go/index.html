<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>패스오더 · 편지</title>
<style>
html,body{margin:0;height:100%;background:#FBF8F4;color:#1F1B17;font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.w{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;box-sizing:border-box;text-align:center}
.sp{width:28px;height:28px;border-radius:50%;border:3px solid #F3D9C6;border-top-color:#F26B1D;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
p{margin:0;font-size:15px;color:#4A453F;line-height:1.6}
a{color:#C4541A}
</style></head>
<body><div class="w"><div class="sp" id="sp"></div><p id="msg">잠시만 기다려 주세요</p></div>
<script>
// 짧은 주소(go/?k=코드) → 결과 시트 「링크」 탭에서 원래 주소를 찾아 바로 넘김.
// 메시지 변수에 긴 주소가 들어가지 않아(길이 제한) 짧게 보내고, 매장 · 닉네임 · 추적 꼬리표는 원래 주소 그대로 전달됨
const APP='https://script.google.com/macros/s/AKfycbxRMhXiCESeg-NJPvTQw9JU5O6-u5PjwKCoWeenIUM_xcvIZ-k6w9XD-Tb3Fy0c7kERBA/exec';
const k=new URLSearchParams(location.search).get('k')||'';
const fail=()=>{document.getElementById('sp').remove();document.getElementById('msg').innerHTML='링크를 찾지 못했어요.<br>카카오톡 메시지의 버튼을 다시 눌러 주세요.';};
if(!/^[A-Za-z0-9]{6,16}$/.test(k)){fail();}
else{
  const ctl=new AbortController();setTimeout(()=>ctl.abort(),10000);
  fetch(APP+'?k='+encodeURIComponent(k),{signal:ctl.signal}).then(r=>r.json())
    .then(j=>{if(j&&j.ok&&/^https:\/\/paytalab-m\.github\.io\//.test(j.url))location.replace(j.url);else fail();})
    .catch(fail);
}
</script></body></html>
